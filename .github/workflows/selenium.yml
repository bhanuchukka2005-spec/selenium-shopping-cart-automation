name: Mini Shopping Cart Selenium Automation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  shopping-cart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run shopping cart Selenium tests and save console output
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Dselenium.headless=true clean compile exec:java 2>&1 | tee test-results.txt

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-shopping-cart-test-results
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 14
